<style>
:root{--c-bg:#000;--c-950:#09090b;--c-900:#18181b;--c-800:#27272a;--c-700:#3f3f46;--c-600:#52525c;--c-500:#71717b;--c-400:#9f9fa9;--c-300:#d4d4d8;--c-200:#e4e4e7;--c-100:#f4f4f5;--c-rose:#ff2056;--c-rose-soft:#ff637e;--c-amber:#ffb900;--c-red:#ff6467;--c-green:#00d492;--line-faint:#ffffff0d;--line:#ffffff14;--line-strong:#ffffff26;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",Arial,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;--r-lg:8px;--r-xl:12px;--r-2xl:16px;--r-3xl:24px;--sh-lg:0 10px 15px -3px #0000001a,0 4px 6px -4px #0000001a;

--glass-sheet-fill:rgb(12 16 22 / .90);--glass-sheet-edge:rgb(255 255 255 / .3) rgb(255 255 255 / .14) rgb(255 255 255 / .14) rgb(255 255 255 / .3);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#101012;color:var(--c-100);font:15px/1.45 var(--font-sans);padding:28px 32px}
h1.title{font:800 22px/1.2 var(--font-sans);margin:0 0 4px;letter-spacing:-.02em}

.board{display:grid;grid-template-columns:repeat(4,390px);gap:40px 32px}

.screen{position:relative;width:390px;height:844px;overflow:hidden;background:var(--c-bg);border-radius:28px;outline:1px solid #ffffff1f;isolation:isolate}

.glass{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:4px;border-radius:999px;color:#fff}
.brand{padding:4px 12px 4px 6px}.brand .tile{width:32px;height:32px;display:block;color:var(--social-accent)}.chat .brand .tile{color:var(--chat-accent)}
.tile .app-tile-mark{width:32px;height:32px;display:block}

.tab.on{color:#fff;font-weight:700;background:rgb(255 255 255 / .16);box-shadow:inset 0 1px 0 rgb(255 255 255 / .25),0 6px 14px -4px rgb(0 0 0 / .35)}
.ui-nav-icon .ui-icon-fill{display:none}.tab.on .ui-nav-icon .ui-icon-line{display:none}.tab.on .ui-nav-icon .ui-icon-fill{display:inline}

.icon-button{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgb(255 255 255 / .12);color:#fff;box-shadow:inset 0 1px 0 rgb(255 255 255 / .25)}.icon-button .ui-icon{width:20px;height:20px}

.apps-tile{display:grid;gap:6px;align-content:start;min-height:156px;padding:16px;border-radius:20px;background:rgb(255 255 255 / .07);box-shadow:inset 0 1px 0 rgb(255 255 255 / .12);color:#fff}
.apps-tile b{font:600 15px/1.3 var(--font-sans);margin-top:4px}.apps-tile small{font:13px/1.4 var(--font-sans);color:rgb(255 255 255 / .72)}
.tile-mark{position:relative;width:64px;height:64px;display:block}.tile-mark .app-tile-mark{width:64px;height:64px;display:block}.tile-mark.social{color:var(--social-accent)}.tile-mark.chat{color:var(--chat-accent)}
.menu-note{margin:16px 0 0;padding-top:14px;border-top:1px solid rgb(255 255 255 / .1);font:13px/1.5 var(--font-sans);color:rgb(255 255 255 / .6)}
/* social feed */
.newpill{position:absolute;z-index:6;top:8px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--social-accent);color:var(--social-accent-ink);font:700 14px/1 var(--font-sans);box-shadow:0 10px 24px -6px rgb(0 0 0 / .6)}
.newpill .up{transform:rotate(90deg)}
.post{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 16px 4px;border-bottom:1px solid var(--line)}
.av{display:inline-grid;place-items:center;flex-shrink:0;border-radius:50%;color:#fff;font-weight:700;line-height:1;box-shadow:inset 0 0 0 1px rgb(255 255 255 / .08)}
.post-main{min-width:0}
.post-head{display:flex;align-items:baseline;gap:4px;min-width:0;font-size:15px;line-height:1.3;white-space:nowrap}
.post-head b{font-weight:600;color:var(--c-100);overflow:hidden;text-overflow:ellipsis}.handle,.dot,time{color:var(--c-400)}.handle{overflow:hidden;text-overflow:ellipsis;min-width:0}
.more{margin-left:auto;align-self:center;color:var(--c-400);padding:0 2px}.more .ui-icon{width:18px;height:18px}

.body{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.media{margin-top:10px;border-radius:16px;overflow:hidden;border:1px solid var(--line);display:grid;gap:2px;background:var(--line)}

.m1{max-height:510px}.m2,.m3,.m4{aspect-ratio:3/2;grid-template-columns:1fr 1fr}.m4{grid-template-rows:1fr 1fr}.m3{grid-template-rows:1fr 1fr}.m3 .ph:first-child{grid-row:span 2}

.act{display:inline-flex;align-items:center;gap:6px;min-width:44px;height:40px;padding:0 10px;color:var(--c-400);font:13px/1 var(--font-sans);font-variant-numeric:tabular-nums}.act .ui-icon{width:18px;height:18px}
.act.liked{color:var(--social-like)}

.thumb{position:relative;width:72px;height:72px;border-radius:12px;overflow:hidden}.thumb .ph{display:block;width:100%;height:100%}
.scrim.low{align-content:end;padding-bottom:10px}.scrim{position:absolute;inset:0;display:grid;place-items:center;background:rgb(0 0 0 / .55);font:600 11px/1.2 var(--font-sans);color:#fff;text-align:center;padding:0 6px}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--social-accent);transform-origin:left}
.ready{position:absolute;top:5px;left:5px;width:20px;height:20px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}.ready .ui-icon{width:13px;height:13px}
.x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgb(0 0 0 / .7);color:#fff;display:grid;place-items:center}.x .ui-icon{width:12px;height:12px}
.compose-foot{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid rgb(255 255 255 / .1)}
.iconbtn{display:grid;place-items:center;width:44px;height:44px;border-radius:999px;color:var(--c-300)}.iconbtn .ui-icon{width:20px;height:20px}

.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 18px;border-radius:999px;font:700 15px/1 var(--font-sans);white-space:nowrap;border:1px solid transparent}
.btn.primary{background:#fff;color:#000}.btn.secondary{background:#18181bcc;border-color:var(--c-700);color:var(--c-200)}.btn.small{height:36px;padding:0 14px;font-size:14px}

.helper{margin:8px 0 0;font:13px/1.4 var(--font-sans);color:var(--c-400);min-height:18px}

.banner{aspect-ratio:3/1;background:linear-gradient(135deg,rgb(166 132 255 / .35),transparent 70%),radial-gradient(circle at 80% 120%,#ff637e55 0 30%,transparent 31%),var(--c-900)}

.prof-body{padding:10px 16px 12px}.prof-body h1{margin:0;font:800 22px/1.2 var(--font-sans);letter-spacing:-.02em}

.bio{margin:10px 0 0}.meta{margin:8px 0 0;font-size:14px;color:var(--c-400)}.stats{margin:8px 0 0;font-size:14px;color:var(--c-400)}.stats b{color:var(--c-100);font-weight:600;margin-left:0}.stats b+*{}

.tabs{position:relative;display:flex;height:48px;border-bottom:1px solid var(--line);background:rgb(0 0 0 / .86)}

.ind{position:absolute;bottom:0;left:calc(16.66% - 20px);width:40px;height:3px;border-radius:3px;background:var(--social-accent)}
/* chat list */
h1.page{margin:0;padding:4px 16px 12px;font:800 28px/1.15 var(--font-sans);letter-spacing:-.02em}

.req-btns{display:flex;gap:6px}

.intro{display:flex;gap:8px;align-items:flex-start;max-width:300px;margin:8px auto 4px;padding:10px 14px;border-radius:16px;background:var(--c-900);font:13px/1.45 var(--font-sans);color:var(--c-400)}.intro .ui-icon,.sys .ui-icon{width:14px;height:14px;margin-top:3px}

.sys{display:flex;gap:6px;justify-content:center;align-items:flex-start;max-width:290px;margin:14px auto 0;text-align:center;font:13px/1.45 var(--font-sans);color:var(--c-400)}
.receipt{display:flex;gap:4px;justify-content:flex-end;align-items:center;margin-top:2px;font:12px/1 var(--font-sans);color:var(--c-400)}.receipt .ui-icon{width:14px;height:14px;color:var(--chat-text)}

.strip-bar{position:relative;height:88px;margin:0 auto;background:linear-gradient(120deg,#5b2a86,#e9b44c 45%,#2e8b57)}
.strip-bar .nav{bottom:12px}
.strip-bar .nav.narrow{left:8px;right:8px;gap:8px}.strip-bar .nav.narrow .menu-circle{width:52px;height:52px;align-self:center}
.strip-bar .nav.narrow .tab{font-size:9px}

.stages{display:flex;gap:8px;padding:0 16px;flex-wrap:wrap}
.stage{display:grid;gap:6px;justify-items:center;width:64px}.stage:last-child{width:auto}
.stage small{font:11px/1.2 var(--font-sans);color:var(--c-400);text-align:center}
.stage .thumb{width:72px;height:72px}.stage{width:72px}

.flag{display:flex;gap:8px;align-items:flex-start;margin:6px 0 2px;padding:8px 10px;border-radius:12px;background:rgb(255 185 0 / .10);color:var(--c-amber);font:600 13px/1.4 var(--font-sans)}.flag .ui-icon{width:16px;height:16px;margin-top:1px}
