<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="forces-title forces-desc">
<title id="forces-title">Balanced and unbalanced forces</title><desc id="forces-desc">A 4 kilogram trolley has a 12 newton push right and 4 newton friction left, leaving 8 newtons right. The normal reaction and weight balance vertically.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28745e"/></marker></defs>
<g font-family="system-ui, sans-serif"><rect x="220" y="115" width="200" height="100" rx="14" fill="#dbe9de" stroke="#28745e" stroke-width="3"/><circle cx="257" cy="232" r="16" fill="#52665b"/><circle cx="383" cy="232" r="16" fill="#52665b"/><text x="320" y="175" font-size="23" fill="#263e38" text-anchor="middle">4 kg trolley</text><path d="M320 109L320 42" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><path d="M320 218L320 296" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><path d="M427 165L579 165" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><path d="M212 165L147 165" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><text x="505" y="134" font-size="18" fill="#263e38" text-anchor="middle">push 12 N</text><text x="112" y="139" font-size="18" fill="#263e38" text-anchor="middle">friction 4 N</text><text x="418" y="43" font-size="18" fill="#263e38" text-anchor="middle">normal force</text><text x="397" y="309" font-size="18" fill="#263e38" text-anchor="middle">weight</text></g></svg>