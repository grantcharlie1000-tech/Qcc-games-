<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="poetry-title poetry-desc">
<title id="poetry-title">Speaker, image and tonal shift</title><desc id="poetry-desc">Three stages of an invented poem move from an open window and hopeful mood, through a hinge word, to a closed latch and confinement.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28745e"/></marker></defs>
<g font-family="system-ui, sans-serif"><rect x="35" y="52" width="235" height="146" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="152.5" y="132.0" font-size="24" fill="#263e38" text-anchor="middle">Open window</text><text x="152" y="166" font-size="18" fill="#263e38" text-anchor="middle">hopeful · airy</text><rect x="370" y="52" width="235" height="146" rx="12" fill="#f4e7d4" stroke="#b6c8ba"/><text x="487.5" y="132.0" font-size="24" fill="#263e38" text-anchor="middle">Closed latch</text><text x="487" y="166" font-size="18" fill="#263e38" text-anchor="middle">confined · tense</text><path d="M278 122L360 122" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="239" font-size="22" fill="#263e38" text-anchor="middle">“but” marks a possible turn</text><text x="320" y="283" font-size="19" fill="#263e38" text-anchor="middle">Test the shift against the whole poem</text></g></svg>