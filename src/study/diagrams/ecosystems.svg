<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="ecosystems-title ecosystems-desc">
<title id="ecosystems-title">Energy moves through a food web</title><desc id="ecosystems-desc">Arrows point from food to consumer: grass to wētā, grass to rabbit, wētā to bird, and rabbit and bird to hawk. The web is a simplified teaching model.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28745e"/></marker></defs>
<g font-family="system-ui, sans-serif"><rect x="30" y="130" width="120" height="65" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="90.0" y="169.5" font-size="19" fill="#263e38" text-anchor="middle">Grass</text><rect x="245" y="35" width="130" height="65" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="310.0" y="74.5" font-size="19" fill="#263e38" text-anchor="middle">Wētā</text><rect x="245" y="238" width="130" height="65" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="310.0" y="277.5" font-size="19" fill="#263e38" text-anchor="middle">Rabbit</text><rect x="450" y="35" width="130" height="65" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="515.0" y="74.5" font-size="19" fill="#263e38" text-anchor="middle">Bird</text><rect x="450" y="238" width="130" height="65" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="515.0" y="277.5" font-size="19" fill="#263e38" text-anchor="middle">Hawk</text><path d="M155 150L238 76" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><path d="M155 180L238 264" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><path d="M380 67L445 67" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><path d="M515 105L515 230" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><path d="M380 270L445 270" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><text x="320" y="181" font-size="20" fill="#263e38" text-anchor="middle">food → consumer</text></g></svg>