<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="hauora-title hauora-desc">
<title id="hauora-title">Four connected dimensions of hauora</title><desc id="hauora-desc">An original schematic of Te Whare Tapa Whā: taha tinana physical, taha hinengaro mental and emotional, taha whānau family and social, and taha wairua spiritual. The dimensions support one another; whenua is the foundation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28745e"/></marker></defs>
