<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="essay-writing-title essay-writing-desc">
<title id="essay-writing-title">Building an evidence-based paragraph</title><desc id="essay-writing-desc">An argument rests on a claim, evidence, explanation of how the evidence works, and a link back to the thesis.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28745e"/></marker></defs>
<g font-family="system-ui, sans-serif"><rect x="54" y="28" width="532" height="56" rx="12" fill="#d8e6dc" stroke="#b6c8ba"/><text x="320.0" y="63.0" font-size="19" fill="#263e38" text-anchor="middle">THESIS · the argument you will prove</text><rect x="90" y="104" width="460" height="48" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="320.0" y="135.0" font-size="19" fill="#263e38" text-anchor="middle">1  Claim: a focused reason</text><rect x="90" y="166" width="460" height="48" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="320.0" y="197.0" font-size="19" fill="#263e38" text-anchor="middle">2  Evidence: a precise detail</text><rect x="90" y="228" width="460" height="48" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="320.0" y="259.0" font-size="19" fill="#263e38" text-anchor="middle">3  Explain: how and why it matters</text><text x="320" y="316" font-size="19" fill="#263e38" text-anchor="middle">Link the reasoning back to the thesis</text></g></svg>