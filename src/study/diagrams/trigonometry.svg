<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="trigonometry-title trigonometry-desc">
<title id="trigonometry-title">Labelling a right-angled triangle</title><desc id="trigonometry-desc">A right triangle has angle theta at the bottom left, opposite side 3, adjacent side 4 and hypotenuse 5. Sine is opposite over hypotenuse.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28745e"/></marker></defs>
<g font-family="system-ui, sans-serif"><path d="M100 280H420V40Z" fill="#e4ede4" stroke="#28745e" stroke-width="4"/><path d="M395 280V255H420" fill="none" stroke="#263e38" stroke-width="2"/><path d="M160 280A60 60 0 0 0 148 244" fill="none" stroke="#c78a29" stroke-width="3"/><text x="178" y="266" font-size="24" fill="#263e38" text-anchor="middle">θ</text><text x="260" y="322" font-size="21" fill="#263e38" text-anchor="middle">adjacent = 4</text><text x="510" y="157" font-size="20" fill="#263e38" text-anchor="middle">opposite</text><text x="510" y="185" font-size="20" fill="#263e38" text-anchor="middle">= 3</text><text x="237" y="139" font-size="20" fill="#263e38" text-anchor="middle">hypotenuse = 5</text></g></svg>