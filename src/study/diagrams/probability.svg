<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="probability-title probability-desc">
<title id="probability-title">Two draws without replacement</title><desc id="probability-desc">A bag contains 3 red and 2 blue counters. First red has probability 3/5, then red 2/4 or blue 2/4; first blue is 2/5, then red 3/4 or blue 1/4.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28745e"/></marker></defs>
<g font-family="system-ui, sans-serif"><path d="M68 169L243 74" fill="none" stroke="#28745e" stroke-width="3"/><path d="M68 169L243 262" fill="none" stroke="#28745e" stroke-width="3"/><rect x="220" y="41" width="110" height="56" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="275.0" y="76.0" font-size="19" fill="#263e38" text-anchor="middle">R: 3/5</text><rect x="220" y="233" width="110" height="56" rx="12" fill="#e5ecf5" stroke="#b6c8ba"/><text x="275.0" y="268.0" font-size="19" fill="#263e38" text-anchor="middle">B: 2/5</text><path d="M332 69L459 35" fill="none" stroke="#28745e" stroke-width="3"/><path d="M332 69L459 119" fill="none" stroke="#28745e" stroke-width="3"/><path d="M332 261L459 213" fill="none" stroke="#28745e" stroke-width="3"/><path d="M332 261L459 305" fill="none" stroke="#28745e" stroke-width="3"/><text x="532" y="42" font-size="20" fill="#263e38" text-anchor="middle">R: 2/4</text><text x="532" y="125" font-size="20" fill="#263e38" text-anchor="middle">B: 2/4</text><text x="532" y="218" font-size="20" fill="#263e38" text-anchor="middle">R: 3/4</text><text x="532" y="311" font-size="20" fill="#263e38" text-anchor="middle">B: 1/4</text><text x="80" y="178" font-size="20" fill="#263e38" text-anchor="middle">Start</text></g></svg>