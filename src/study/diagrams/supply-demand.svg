<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="supply-demand-title supply-demand-desc">
<title id="supply-demand-title">A competitive market equilibrium</title><desc id="supply-demand-desc">Demand slopes down, supply slopes up. Their intersection is the equilibrium. A higher price creates excess supply; a lower price creates excess demand, other things equal.</desc>
