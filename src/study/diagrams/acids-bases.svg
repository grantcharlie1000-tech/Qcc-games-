<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="acids-bases-title acids-bases-desc">
<title id="acids-bases-title">Reading the pH scale</title><desc id="acids-bases-desc">A simplified aqueous pH scale places acidic solutions below 7, neutral at 7 and alkaline solutions above 7, at 25 degrees Celsius. Each unit represents a tenfold change in hydrogen ion concentration.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28745e"/></marker></defs>
<g font-family="system-ui, sans-serif"><rect x="40" y="110" width="40" height="62" fill="#b34f4c"/><text x="60" y="207" font-size="18" fill="#263e38" text-anchor="middle">0</text><rect x="80" y="110" width="40" height="62" fill="#ba6250"/><text x="100" y="207" font-size="18" fill="#263e38" text-anchor="middle">1</text><rect x="120" y="110" width="40" height="62" fill="#bd754f"/><text x="140" y="207" font-size="18" fill="#263e38" text-anchor="middle">2</text><rect x="160" y="110" width="40" height="62" fill="#bf884e"/><text x="180" y="207" font-size="18" fill="#263e38" text-anchor="middle">3</text><rect x="200" y="110" width="40" height="62" fill="#b09a55"/><text x="220" y="207" font-size="18" fill="#263e38" text-anchor="middle">4</text><rect x="240" y="110" width="40" height="62" fill="#96a25c"/><text x="260" y="207" font-size="18" fill="#263e38" text-anchor="middle">5</text><rect x="280" y="110" width="40" height="62" fill="#79a26d"/><text x="300" y="207" font-size="18" fill="#263e38" text-anchor="middle">6</text><rect x="320" y="110" width="40" height="62" fill="#59957c"/><text x="340" y="207" font-size="18" fill="#263e38" text-anchor="middle">7</text><rect x="360" y="110" width="40" height="62" fill="#508b8c"/><text x="380" y="207" font-size="18" fill="#263e38" text-anchor="middle">8</text><rect x="400" y="110" width="40" height="62" fill="#4b8196"/><text x="420" y="207" font-size="18" fill="#263e38" text-anchor="middle">9</text><rect x="440" y="110" width="40" height="62" fill="#47749c"/><text x="460" y="207" font-size="18" fill="#263e38" text-anchor="middle">10</text><rect x="480" y="110" width="40" height="62" fill="#50679b"/><text x="500" y="207" font-size="18" fill="#263e38" text-anchor="middle">11</text><rect x="520" y="110" width="40" height="62" fill="#645c91"/><text x="540" y="207" font-size="18" fill="#263e38" text-anchor="middle">12</text><rect x="560" y="110" width="40" height="62" fill="#79548c"/><text x="580" y="207" font-size="18" fill="#263e38" text-anchor="middle">13</text><rect x="600" y="110" width="40" height="62" fill="#874c7c"/><text x="620" y="207" font-size="18" fill="#263e38" text-anchor="middle">14</text><text x="145" y="75" font-size="24" fill="#263e38" text-anchor="middle">Acidic</text><text x="340" y="75" font-size="24" fill="#263e38" text-anchor="middle">Neutral</text><text x="525" y="75" font-size="24" fill="#263e38" text-anchor="middle">Alkaline</text><path d="M340 84L340 102" fill="none" stroke="#28745e" stroke-width="3"/><text x="320" y="267" font-size="22" fill="#263e38" text-anchor="middle">1 pH step = 10× change in [H⁺]</text><text x="320" y="307" font-size="18" fill="#263e38" text-anchor="middle">Compare concentration, not just the numbers</text></g></svg>