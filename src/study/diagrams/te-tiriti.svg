<title id="te-tiriti-title">Reading two texts in context</title><desc id="te-tiriti-desc">The Māori and English texts of the Treaty are distinct. Article 1 uses kāwanatanga in te reo Māori and sovereignty in English. Article 2 affirms tino rangatiratanga in the Māori text. Compare texts alongside context and perspectives.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28745e"/></marker></defs>
