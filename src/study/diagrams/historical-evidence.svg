<g font-family="system-ui, sans-serif"><rect x="28" y="35" width="178" height="75" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="117.0" y="79.5" font-size="19" fill="#263e38" text-anchor="middle">Diary</text><rect x="231" y="35" width="178" height="75" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="320.0" y="79.5" font-size="19" fill="#263e38" text-anchor="middle">Photograph</text><rect x="434" y="35" width="178" height="75" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="523.0" y="79.5" font-size="19" fill="#263e38" text-anchor="middle">Oral testimony</text><path d="M117 114L260 218" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><path d="M320 114L320 218" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><path d="M523 114L380 218" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><rect x="165" y="226" width="310" height="75" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="320.0" y="270.5" font-size="19" fill="#263e38" text-anchor="middle">Corroborated, qualified claim</text><text x="320" y="328" font-size="18" fill="#263e38" text-anchor="middle">Who? When? Why? What is missing?</text></g></svg>