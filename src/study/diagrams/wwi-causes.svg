<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="wwi-causes-title wwi-causes-desc">
<title id="wwi-causes-title">Long-term pressures and immediate decisions</title><desc id="wwi-causes-desc">Militarism, alliances, imperial competition and nationalism form long-term pressures. The assassination at Sarajevo was a trigger; the July Crisis involved decisions that widened the conflict.</desc>
