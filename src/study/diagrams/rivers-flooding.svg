<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="rivers-flooding-title rivers-flooding-desc">
<title id="rivers-flooding-title">From rainfall to flood risk</title><desc id="rivers-flooding-desc">Rainfall reaching a catchment can infiltrate soil or move as surface runoff. Impermeable ground sends water quickly to the river. Flood risk combines hazard, exposure and vulnerability.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28745e"/></marker></defs>
<g font-family="system-ui, sans-serif"><path d="M20 170L150 95L265 200L388 110L620 255V330H20Z" fill="#dbe8d9"/><path d="M265 200Q300 240 360 220T500 270T620 300" fill="none" stroke="#5188a5" stroke-width="26"/><path d="M285 43l-10 33m45-33-10 33m45-33-10 33" stroke="#5188a5" stroke-width="4"/><rect x="430" y="120" width="140" height="65" rx="12" fill="#f4e7d4" stroke="#b6c8ba"/><text x="500.0" y="159.5" font-size="19" fill="#263e38" text-anchor="middle">Town</text><path d="M160 145L236 201" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><path d="M421 174L433 226" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><text x="155" y="61" font-size="21" fill="#263e38" text-anchor="middle">Catchment</text><text x="174" y="267" font-size="19" fill="#263e38" text-anchor="middle">runoff</text><text x="335" y="315" font-size="20" fill="#263e38" text-anchor="middle">river → downstream</text></g></svg>