<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="energy-title energy-desc">
<title id="energy-title">Accounting for a 100 joule input</title><desc id="energy-desc">A device transfers 100 joules of energy: 60 joules usefully to motion, 30 joules to thermal energy and 10 joules to sound. The transfers sum to the input.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28745e"/></marker></defs>
<g font-family="system-ui, sans-serif"><rect x="35" y="124" width="160" height="86" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="115.0" y="174.0" font-size="19" fill="#263e38" text-anchor="middle">100 J input</text><path d="M200 165L285 165" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><rect x="295" y="30" width="295" height="65" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="442.5" y="69.5" font-size="19" fill="#263e38" text-anchor="middle">Motion · 60 J</text><rect x="295" y="135" width="295" height="65" rx="12" fill="#f4e7d4" stroke="#b6c8ba"/><text x="442.5" y="174.5" font-size="19" fill="#263e38" text-anchor="middle">Thermal · 30 J</text><rect x="295" y="240" width="295" height="65" rx="12" fill="#e5ecf5" stroke="#b6c8ba"/><text x="442.5" y="279.5" font-size="19" fill="#263e38" text-anchor="middle">Sound · 10 J</text><path d="M275 165L275 62" fill="none" stroke="#28745e" stroke-width="3"/><path d="M275 62L288 62" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><path d="M275 165L288 165" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><path d="M275 165L275 272" fill="none" stroke="#28745e" stroke-width="3"/><path d="M275 272L288 272" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/></g></svg>