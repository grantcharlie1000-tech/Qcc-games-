<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="algorithms-title algorithms-desc">
<title id="algorithms-title">Tracing a running total</title><desc id="algorithms-desc">An algorithm starts with total zero and a list of scores, repeatedly adds the next score to total until there are none left, and then outputs total.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#28745e"/></marker></defs>
<g font-family="system-ui, sans-serif"><rect x="200" y="20" width="240" height="55" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="320.0" y="54.5" font-size="19" fill="#263e38" text-anchor="middle">total ← 0</text><path d="M320 79L320 111" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><rect x="200" y="118" width="240" height="65" rx="12" fill="#f4e7d4" stroke="#b6c8ba"/><text x="320.0" y="157.5" font-size="19" fill="#263e38" text-anchor="middle">Any scores left?</text><path d="M195 150L103 150" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><text x="144" y="132" font-size="18" fill="#263e38" text-anchor="middle">yes</text><rect x="25" y="205" width="250" height="65" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="150.0" y="244.5" font-size="19" fill="#263e38" text-anchor="middle">Add next score to total</text><path d="M103 155L103 199" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><path d="M103 275L103 311" fill="none" stroke="#28745e" stroke-width="3"/><path d="M103 311L580 311" fill="none" stroke="#28745e" stroke-width="3"/><path d="M580 311L580 150" fill="none" stroke="#28745e" stroke-width="3"/><path d="M580 150L446 150" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><path d="M320 188L320 214" fill="none" stroke="#28745e" stroke-width="3" marker-end="url(#arrow)"/><text x="348" y="209" font-size="18" fill="#263e38" text-anchor="middle">no</text><rect x="295" y="222" width="205" height="55" rx="12" fill="#e3eee5" stroke="#b6c8ba"/><text x="397.5" y="256.5" font-size="19" fill="#263e38" text-anchor="middle">Output total</text></g></svg>