<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 410" role="img" aria-labelledby="title desc"><title id="title">A teal muncher races along a neon maze ahead of two flame-shaped chasers</title><desc id="desc">Original illustrated game cover for Pocket Arcade.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151b4a"/><stop offset="1" stop-color="#070a24"/></linearGradient>
<radialGradient id="nib" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#8dffe0"/><stop offset=".55" stop-color="#3fe0bd"/><stop offset="1" stop-color="#14a487"/></radialGradient>
<radialGradient id="berry" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe9a8"/><stop offset=".5" stop-color="#ffcf6b"/><stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="320" height="410" fill="url(#bg)"/>
<g fill="#0b1350" stroke="#4d7dff" stroke-width="3" stroke-linejoin="round" filter="url(#glow)">
<rect x="-20" y="112" width="128" height="44" rx="10"/><rect x="150" y="112" width="190" height="44" rx="10"/>
<rect x="-20" y="306" width="96" height="44" rx="10"/><rect x="118" y="306" width="84" height="120" rx="10"/><rect x="244" y="306" width="96" height="44" rx="10"/>
<rect x="-20" y="384" width="96" height="60" rx="10"/><rect x="244" y="384" width="96" height="60" rx="10"/>
</g>
<g fill="#ffe2c4"><circle cx="20" cy="231" r="3.5"/><circle cx="44" cy="231" r="3.5"/><circle cx="68" cy="231" r="3.5"/><circle cx="270" cy="231" r="3.5"/><circle cx="294" cy="231" r="3.5"/>
<circle cx="97" cy="275" r="3.5"/><circle cx="97" cy="367" r="3.5"/><circle cx="223" cy="275" r="3.5"/><circle cx="223" cy="367" r="3.5"/><circle cx="160" cy="275" r="3.5"/><circle cx="129" cy="275" r="3.5"/><circle cx="191" cy="275" r="3.5"/>
<circle cx="40" cy="184" r="3.5"/><circle cx="70" cy="184" r="3.5"/><circle cx="100" cy="184" r="3.5"/><circle cx="130" cy="184" r="3.5"/><circle cx="160" cy="184" r="3.5"/><circle cx="190" cy="184" r="3.5"/></g>
<circle cx="292" cy="184" r="18" fill="url(#berry)"/><circle cx="292" cy="184" r="8" fill="#ffcf6b"/>
<!-- Drift, the aqua chaser -->
<g transform="translate(36 220) scale(3.6)" filter="url(#shadow)"><path d="M1-8C2.5-5 6.4-2.4 6.4 1.8C6.4 5.6 3.6 7 0 7C-3.6 7-6.4 5.6-6.4 1.8C-6.4-2.4-1.5-5 1-8Z" fill="#39d5ff"/><circle cx="-3.4" cy="7.8" r="1" fill="#39d5ff" opacity=".75"/><circle cx="3.2" cy="8.4" r=".8" fill="#39d5ff" opacity=".75"/><ellipse cy=".2" rx="3.2" ry="3.4" fill="#fff"/><circle cx="1.4" cy=".2" r="1.6" fill="#141d4a"/><path d="M-5.4 4.4Q0 6.2 5.4 4.4" stroke="#0b4f66" stroke-width="1.2" fill="none" stroke-linecap="round"/></g>
<!-- Rook, the crimson chaser -->
<g transform="translate(108 236) scale(4.4)" filter="url(#shadow)"><path d="M-1-8C1.5-5 6.4-2.4 6.4 1.8C6.4 5.6 3.6 7 0 7C-3.6 7-6.4 5.6-6.4 1.8C-6.4-2.4-2.5-5-1-8Z" fill="#ff4d5e"/><circle cx="-3.4" cy="7.8" r="1" fill="#ff4d5e" opacity=".75"/><circle cx="3.2" cy="8.4" r=".8" fill="#ff4d5e" opacity=".75"/><ellipse cy=".2" rx="3.2" ry="3.4" fill="#fff"/><circle cx="1.4" cy=".2" r="1.6" fill="#141d4a"/><path d="M-3.2-4.6-.6-3.3M3.2-4.6.6-3.3" stroke="#3a0710" stroke-width="1.1" stroke-linecap="round"/></g>
<!-- Nib, the muncher, mid-chomp -->
<g transform="translate(212 228) scale(6.2)" filter="url(#shadow)">
<ellipse cx="-2.6" cy="5.6" rx="2.1" ry="1.3" fill="#0f7f6a"/><ellipse cx="2" cy="6" rx="2.1" ry="1.3" fill="#0f7f6a"/>
<path d="M0-5.5Q.5-8.5 2.6-9.2M-2.4-5Q-3-8.5-1-9.6" fill="none" stroke="#0f7f6a" stroke-width=".9" stroke-linecap="round"/><circle cx="2.6" cy="-9.2" r="1.15" fill="#ffe14d"/><circle cx="-1" cy="-9.6" r="1.15" fill="#ffe14d"/>
<path d="M6.38-.31A6.4 6.4 0 1 0-1.28 6.27L-1.2.9Z" fill="url(#nib)"/>
<path d="M-1.2.9 4.06 5.14Q1.53 6.79-1.71 5.44Q-1.6 5.6-1.2.9Z" fill="#14a487"/>
<path d="M-1.2.9 6.38-.31 4.06 5.14Z" fill="#0b2a33"/><path d="M3.1 3.3 3.7 3.9 4.1 2.9Z" fill="#fffbe8"/>
<ellipse cx="1.4" cy="-2.6" rx="2.2" ry="2.4" fill="#fff"/><circle cx="2.3" cy="-2.4" r="1.15" fill="#0b2a33"/><circle cx="1.9" cy="-3.1" r=".4" fill="#fff"/><ellipse cx="-3.4" cy="-.4" rx="1.3" ry=".8" fill="#ff8fb0" opacity=".7"/>
</g>
<!-- a frightened chaser below -->
<g transform="translate(160 350) scale(3.4)" opacity=".95"><path d="M0-8C2-5 6.4-2.4 6.4 1.8C6.4 5.6 3.6 7 0 7C-3.6 7-6.4 5.6-6.4 1.8C-6.4-2.4-2-5 0-8Z" fill="#2b3cff"/><circle cx="-2.2" cy="-1" r="1" fill="#ffd0b0"/><circle cx="2.2" cy="-1" r="1" fill="#ffd0b0"/><path d="M-4 3.4-2.7 2.3-1.3 3.4 0 2.3 1.3 3.4 2.7 2.3 4 3.4" stroke="#ffd0b0" stroke-width=".9" fill="none" stroke-linejoin="round"/></g>
</svg>
