<path fill="#ffc23d" d="M100 210c0-30 20-46 46-46s46 16 46 46c-14-10-30-14-46-14s-32 4-46 14z"/>
<path fill="#14213d" d="M108 216c8-14 68-14 78 0 2 18-16 30-39 30s-41-12-39-30z"/>
<path fill="#ffffff" opacity=".18" d="M116 214c10-6 22-8 30-8-8 4-16 10-20 18z"/>
<ellipse cx="170" cy="224" rx="6" ry="8" fill="#9ff3ff"/><ellipse cx="136" cy="224" rx="6" ry="8" fill="#9ff3ff"/>
<path stroke="#2b2f36" stroke-width="4" stroke-linecap="round" d="M168 170l8-26"/><circle cx="177" cy="141" r="8" fill="#ffc23d"/>
