<path fill="#9c4a33" d="M0 196h320v92H0z"/>
<path fill="#efe2c4" d="M0 190h320v10H0zM0 246h320v6H0z"/>
<g fill="#5fa3d6" stroke="#f4efe2" stroke-width="4">
  <path d="M14 208h44v30H14zM78 208h44v30H78zM198 208h44v30H198zM262 208h44v30H262zM14 258h44v24H14zM262 258h44v24H262z"/>
</g>
<path fill="#f4efe2" d="M34 208h4v30h-4zM98 208h4v30h-4zM218 208h4v30h-4zM282 208h4v30h-4z"/>
<!-- banner on the block: navy board with gold rule (no lettering) -->
<path fill="#1d2f5c" stroke="#f2b733" stroke-width="3" d="M132 204h56v38h-56z"/>
