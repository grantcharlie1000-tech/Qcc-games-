<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 410" role="img" aria-labelledby="qc-title qc-desc">
<title id="qc-title">Quad Clash Q-bot taking aim</title>
<desc id="qc-desc">A gold Q-bot with a QCC crest fires a giant pencil sidearm across the school quad while a blue rival bursts into confetti beside the brick classroom block.</desc>
<defs>
  <linearGradient id="qc-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2f5c"/><stop offset=".55" stop-color="#2f5fa8"/><stop offset="1" stop-color="#8cc6ea"/></linearGradient>
  <linearGradient id="qc-body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd76a"/><stop offset=".6" stop-color="#ffc23d"/><stop offset="1" stop-color="#e09a18"/></linearGradient>
  <linearGradient id="qc-pave" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d2c0"/><stop offset="1" stop-color="#b9b19c"/></linearGradient>
  <radialGradient id="qc-flash" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe6"/><stop offset=".45" stop-color="#ffd65a"/><stop offset="1" stop-color="#ff8a1e" stop-opacity="0"/></radialGradient>
  <clipPath id="qc-card"><path d="M0 0h320v410H0z"/></clipPath>
</defs>
<g clip-path="url(#qc-card)">
<path fill="#1d2f5c" d="M0 0h320v410H0z"/>
<path fill="url(#qc-sky)" d="M0 95h320v220H0z"/>
