<ellipse cx="124" cy="390" rx="17" ry="9" fill="#ffc23d"/><ellipse cx="169" cy="390" rx="17" ry="9" fill="#ffc23d"/>
<!-- arm and pencil sidearm -->
<path fill="none" stroke="#f3efe6" stroke-width="18" stroke-linecap="round" d="M182 300l30-18"/>
<g transform="rotate(-24 222 276)">
  <path fill="#f28bb0" d="M196 268h14v20h-14z"/>
  <path fill="#b9bec4" d="M210 266h8v24h-8z"/>
  <path fill="#ffc93c" d="M218 266h56l4 6v12l-4 6h-56z"/>
  <path fill="#e3a91f" d="M218 281h60v3l-4 6h-56z"/>
  <path fill="#f1d7a8" d="M278 266l26 12-26 12z"/>
  <path fill="#2b2f36" d="M296 274l10 4-10 4z"/>
  <circle cx="216" cy="288" r="11" fill="#f3efe6"/>
</g>
<!-- muzzle flash and tracer -->
<circle cx="298" cy="244" r="20" fill="url(#qc-flash)"/>
<path stroke="#fff1b0" stroke-width="3" stroke-linecap="round" d="M304 240l16-8" opacity=".9"/>
<!-- crosshair over the rival -->
<g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".92">
  <path d="M262 214v-12M262 262v12M238 238h-12M286 238h12"/>
  <circle cx="262" cy="238" r="3" fill="#fff" stroke="none"/>
</g>
<!-- falling confetti -->
<g fill="#f2b733"><path d="M30 128l8 2-2 7-8-2zM70 150l6 4-4 5-6-4zM42 300l8-1 1 7-8 1z"/></g>
<g fill="#ffffff" opacity=".9"><path d="M88 120l6 2-2 6-6-2zM20 170l7 1-1 6-7-1zM60 330l6 3-3 5-6-3z"/></g>
<g fill="#ff4d6a"><path d="M196 120l7 3-3 6-7-3zM120 134l7-2 2 6-7 2z"/></g>
</g>
</svg>
