<path fill="url(#qc-pave)" d="M0 288h320v122H0z"/>
<g stroke="#a59d88" stroke-width="1.5" opacity=".7"><path d="M0 312h320M0 344h320M0 384h320M40 288 18 410M110 288 98 410M180 288 184 410M250 288 270 410"/></g>
