<g fill="#2f6fe0"><path d="M246 190l7 3-3 6-7-3zM292 248l8-1 1 7-8 1z"/></g>
<g fill="#f2b733"><path d="M232 260l6 5-5 5-6-5zM300 182l7 1-1 7-7-1z"/></g>
<!-- hero egg: one tapered shell, face and house band -->
<ellipse cx="146" cy="392" rx="66" ry="11" fill="#000" opacity=".22"/>
<path fill="#f3efe6" d="M146 202c-36 0-72 59-72 112 0 100 144 100 144 0 0-53-36-112-72-112z"/>
