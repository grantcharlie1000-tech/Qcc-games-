<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 410" role="img" aria-labelledby="qc-title qc-desc">
<title id="qc-title">Quad Clash egg fighter taking aim</title>
<desc id="qc-desc">An egg fighter with a gold shell band with a QCC crest fires a giant pencil sidearm across the school campus while a blue rival bursts into confetti beside the green-roof classroom block.</desc>
<defs>
  <linearGradient id="qc-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2f5c"/><stop offset=".55" stop-color="#2f5fa8"/><stop offset="1" stop-color="#8cc6ea"/></linearGradient>
  <linearGradient id="qc-body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd76a"/><stop offset=".6" stop-color="#ffc23d"/><stop offset="1" stop-color="#e09a18"/></linearGradient>
  <linearGradient id="qc-pave" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d2c0"/><stop offset="1" stop-color="#b9b19c"/></linearGradient>
  <radialGradient id="qc-flash" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe6"/><stop offset=".45" stop-color="#ffd65a"/><stop offset="1" stop-color="#ff8a1e" stop-opacity="0"/></radialGradient>
  <clipPath id="qc-card"><path d="M0 0h320v410H0z"/></clipPath>
</defs>
<g clip-path="url(#qc-card)">
<path fill="#1d2f5c" d="M0 0h320v410H0z"/>
<path fill="url(#qc-sky)" d="M0 95h320v220H0z"/>
<!-- hills -->
<path fill="#3f6f62" d="M0 214 46 186 92 206 140 176 196 204 246 178 320 206V240H0z"/>
<!-- classroom block -->
<path fill="#e9e5d4" d="M0 196h320v92H0z"/>
<path fill="#2e5048" d="M0 190h320v10H0zM0 246h320v6H0z"/>
<g fill="#5fa3d6" stroke="#f4efe2" stroke-width="4">
  <path d="M14 208h44v30H14zM78 208h44v30H78zM198 208h44v30H198zM262 208h44v30H262zM14 258h44v24H14zM262 258h44v24H262z"/>
</g>
<path fill="#f4efe2" d="M34 208h4v30h-4zM98 208h4v30h-4zM218 208h4v30h-4zM282 208h4v30h-4z"/>
<!-- banner on the block: navy board with gold rule (no lettering) -->
<path fill="#1d2f5c" stroke="#f2b733" stroke-width="3" d="M132 204h56v38h-56z"/>
<path fill="#f2b733" d="M147 214c7-5 19-5 26 0v10c0 6-6 11-13 13-7-2-13-7-13-13z"/>
<!-- quad pavers -->
<path fill="url(#qc-pave)" d="M0 288h320v122H0z"/>
<g stroke="#a59d88" stroke-width="1.5" opacity=".7"><path d="M0 312h320M0 344h320M0 384h320M40 288 18 410M110 288 98 410M180 288 184 410M250 288 270 410"/></g>
<!-- crate cover -->
<path fill="#c98f4d" d="M236 300h58v52h-58z"/><path fill="none" stroke="#7e5226" stroke-width="7" d="M240 304h50v44h-50zM241 305l48 42"/>
<!-- rival egg bursting into confetti -->
<g transform="translate(262 238)">
  <ellipse cx="0" cy="58" rx="26" ry="6" fill="#000" opacity=".18"/>
  <path fill="#f3efe6" d="M0-20C-12-20-26 14-26 34c0 29 52 29 52 0C26 14 12-20 0-20z"/>
  <path fill="#2f6fe0" d="M-26 29h52v12c-13 6-39 6-52 0z"/>
  <g fill="#14213d"><ellipse cx="-8" cy="9" rx="3" ry="5"/><ellipse cx="8" cy="9" rx="3" ry="5"/></g>
