[build]
  command = "npm run build"
  publish = "dist"
[context.production]
  command = "npm run db:migrate -- --expect-env production && npm run build"
[context.deploy-preview]
  command = "npm run db:migrate -- --expect-env preview && npm run build"
[context.branch-deploy]
  command = "npm run db:migrate -- --expect-env preview && npm run build"
[build.environment]
  NODE_VERSION = "22"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-DNS-Prefetch-Control = "off"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://image.tmdb.org; connect-src 'self' https://0.peerjs.com wss://0.peerjs.com; worker-src 'self'; media-src 'self'; frame-src https://framextv.xyz https://framextv.cc https://vidlink.pro https://vixsrc.to https://vidsrc.to; form-action 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/movies/*"
  [headers.values]
    Cache-Control = "no-store"
