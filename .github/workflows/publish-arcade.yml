# Manual production recovery and isolated play-test publisher.
name: Build and publish arcade
on:
  workflow_dispatch:
    inputs:
      preview_branch:
        description: 'Optional isolated preview name; leave empty to publish production'
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: arcade-pages-${{ inputs.preview_branch || 'production' }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/production' || inputs.preview_branch != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Preserve the production recovery path; play-test builds run the full build.
      - name: Build production recovery app
        if: inputs.preview_branch == ''
        run: npx vite build
      - name: Build play-test app
        if: inputs.preview_branch != ''
        run: npm run build
      - name: Prepare Cloudflare Pages bundle
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx --yes wrangler@4.157.0 pages functions build functions --outdir dist/_worker.js --compatibility-date 2026-11-04 --minify
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("dist/deploy-info.json", JSON.stringify({commit:process.env.GITHUB_SHA,project:"nceastudy",sourceBranch:process.env.GITHUB_REF_NAME,builtAt:new Date().toISOString()})+"\n");'
      - name: Save upload-ready Cloudflare bundle
        uses: actions/upload-artifact@v4
        with:
          name: nceastudy-pages-${{ inputs.preview_branch || 'production' }}
          path: dist/
          retention-days: 7
          include-hidden-files: true
      - name: Check Cloudflare deployment target
        id: pages-target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_BRANCH: ${{ inputs.preview_branch }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          if(process.env.GITHUB_REF_TYPE!=='branch')throw new Error('Publish from a branch, not a tag.');
          const latest=execFileSync('git',['ls-remote','origin',process.env.GITHUB_REF],{encoding:'utf8'}).trim().split(/\s/)[0];
          if(latest!==process.env.GITHUB_SHA)throw new Error('A newer source commit exists; publish the latest workflow run instead.');
          const preview=process.env.PREVIEW_BRANCH||'';
          if(preview&&!/^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$/.test(preview))throw new Error('Preview names must be 1–40 lowercase letters, digits or hyphens.');
          if(!preview&&process.env.GITHUB_REF!=='refs/heads/production')throw new Error('Production publication requires the production source branch.');
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account)throw new Error('Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository Actions secrets.');
          if(!/^[a-f0-9]{32}$/i.test(account))throw new Error('CLOUDFLARE_ACCOUNT_ID must be a Cloudflare account ID.');
          const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/nceastudy`,{headers:{Authorization:`Bearer ${token}`},signal:AbortSignal.timeout(15000)});
          if(!response.ok)throw new Error(`Cloudflare project lookup failed (HTTP ${response.status}); check token access.`);
          const body=await response.json(),project=body.result;
          if(!body.success||project?.name!=='nceastudy'||project.subdomain!=='nceastudy.pages.dev')throw new Error('Cloudflare returned an unexpected Pages project.');
          if(project.production_branch!=='production')throw new Error('Cloudflare must use the production branch; refusing to publish.');
          if(preview===project.production_branch)throw new Error('A play-test cannot target production.');
          const branch=preview||project.production_branch;
          appendFileSync(process.env.GITHUB_OUTPUT,`branch=${branch}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT,`environment=${preview?'preview':'production'}\n`);
          console.log(`Publishing ${process.env.GITHUB_REF_NAME} to nceastudy's ${preview?'preview':'production'} branch (${branch}).`);
          JS
      - name: Publish to Cloudflare Pages
        id: pages-deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.157.0'
          command: pages deploy dist --project-name=nceastudy --branch="${{ steps.pages-target.outputs.branch }}" --commit-hash=${{ github.sha }}
      - name: Verify published revision
        env:
          PAGES_ENVIRONMENT: ${{ steps.pages-deploy.outputs.pages-environment }}
          EXPECTED_ENVIRONMENT: ${{ steps.pages-target.outputs.environment }}
          DEPLOYMENT_URL: ${{ steps.pages-deploy.outputs.deployment-url }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {setTimeout as delay} from 'node:timers/promises';
          if(process.env.PAGES_ENVIRONMENT!==process.env.EXPECTED_ENVIRONMENT)throw new Error('Cloudflare returned an unexpected deployment environment.');
          const preview=process.env.EXPECTED_ENVIRONMENT==='preview';
          const url=new URL(preview?process.env.DEPLOYMENT_URL:'https://nceastudy.pages.dev');
          if(url.protocol!=='https:'||!/^([a-z0-9-]+\.)?nceastudy\.pages\.dev$/.test(url.hostname))throw new Error('Unexpected deployment URL.');
          for(let attempt=0;attempt<12;attempt++){
            try{
              const response=await fetch(`${url.origin}/deploy-info.json?commit=${process.env.GITHUB_SHA}&attempt=${attempt}`,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(10000)});
              if(response.ok&&(await response.json()).commit===process.env.GITHUB_SHA){
                console.log(`Verified ${process.env.EXPECTED_ENVIRONMENT} is live at ${url.origin}`);
                appendFileSync(process.env.GITHUB_STEP_SUMMARY,`Published [Last Light play-test](${url.origin}/#/game/last-light) from commit ${process.env.GITHUB_SHA}.\n`);
                process.exit(0);
              }
            }catch{}
            await delay(5000);
          }
          throw new Error('The deployment URL did not serve this commit; inspect the Cloudflare deployment.');
          JS
