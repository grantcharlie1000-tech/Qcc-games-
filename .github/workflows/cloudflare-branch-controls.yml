name: Stop obsolete main publisher
on:
  push:
    branches: [ops/cloudflare-production-branch]
    paths: ['.github/workflows/cloudflare-branch-controls.yml']
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel old main deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const url='https://api.github.com/repos/grantcharlie1000-tech/Qcc-games-/actions/runs/42444637987';
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'};
          const res=await fetch(url,{headers}); if(!res.ok)throw new Error(`Run lookup HTTP ${res.status}`);
          const run=await res.json();
          if(run.head_branch!=='main'||run.head_sha!=='f909eb126255b135e0ad592fa126d9d4b23c3260'||run.name!=='Verify and deploy arcade')throw new Error('Unexpected run');
          if(run.status==='completed'){console.log('Already completed:',run.conclusion);process.exit(0);}
          const cancel=await fetch(url+'/cancel',{method:'POST',headers});
          if(!cancel.ok)throw new Error(`Cancel HTTP ${cancel.status}`);
          console.log('Cancellation accepted for obsolete main publishing workflow 42444637987');
          JS
