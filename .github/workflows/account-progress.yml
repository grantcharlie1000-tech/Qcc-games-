name: Account Continue Watching regression
on:
  pull_request:
    paths:
      - 'src/accounts/**'
      - 'src/movies/**'
      - 'src/main.ts'
      - 'netlify/database/migrations/**'
      - 'tests/accounts/movie-progress.test.ts'
      - 'tests/movies/account-*'
      - '.github/workflows/account-progress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run tests/movies/account-storage.test.ts tests/movies/storage.test.ts tests/accounts/movie-progress.test.ts --maxWorkers=2 --testTimeout=15000
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/movies/account-progress.spec.ts tests/movies/progress.spec.ts --workers=1
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-continue-watching-browser-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 7
