name: Verify and deploy arcade
on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify native diagnostic helper
        run: node --test scripts/update-native-trace.test.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run verify:update
        env:
          ARCADE_UPDATE_NATIVE_TRACE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      - run: npm run verify:offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-verification
          path: |
            playwright-report
            test-results
            docs/evidence/release
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
