name: Verify and deploy arcade
on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run verify:update
      - run: npm run verify:offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-verification
          path: |
            playwright-report
            test-results
            docs/evidence/release
