name: Verify and deploy arcade
on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  campaign-regression:
    name: Campaign regression (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Fast feedback on the dense-board regression; the full suite below
      # remains mandatory and retains every existing verification step.
      - run: xvfb-run -a npm run test:e2e -- --project=${{ matrix.browser }} tests/games/campaigns.spec.ts --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-${{ matrix.browser }}
          path: test-results
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Timing budgets must not compete with other test workers on shared runners.
      - run: npm test -- --maxWorkers=1
      - name: Verify native diagnostic helper
        run: node --test scripts/update-native-trace.test.mjs
      - run: npx playwright install --with-deps chromium webkit
      # Full Chromium under a virtual display preserves native pointer-lock input.
      - run: xvfb-run -a npm run test:e2e
      - run: npm run build
      - run: npm run verify:update
        env:
          ARCADE_UPDATE_NATIVE_TRACE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      - run: npm run verify:offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-verification
          path: |
            playwright-report
            test-results
            docs/evidence/release
            docs/evidence/article-reading-layout
            docs/evidence/mauri-branding
