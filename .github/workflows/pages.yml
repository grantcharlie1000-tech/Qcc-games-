name: Verify and deploy arcade
on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || format('pages-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  campaign-regression:
    name: Campaign regression (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Package mirrors can be slow; keep this separate from the test's timeout.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Avoid the slow Azure mirror documented in actions/runner-images#12949.
      - name: Use Ubuntu archive for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Fast feedback on the dense-board regression; the full suite below
      # remains mandatory and retains every existing verification step.
      - run: xvfb-run -a npm run test:e2e -- --project=${{ matrix.browser }} tests/games/campaigns.spec.ts --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-${{ matrix.browser }}
          path: test-results
  browser-e2e:
    name: Full browser suite (${{ matrix.browser }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Two shards per browser: the single-worker WebKit run outgrew the 75 minute budget.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Avoid the slow Azure mirror documented in actions/runner-images#12949.
      - name: Use Ubuntu archive for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: xvfb-run -a npm run test:e2e -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Timing budgets must not compete with other test workers on shared runners.
      - run: npm test -- --maxWorkers=1
      # Production worker recovery uses Chromium against the built site on port 4618.
      - name: Use Ubuntu archive for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run verify:noindex
      - name: Verify service worker kill switch and returning-visitor recovery
        run: npm run verify:offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-verification
          path: |
            playwright-report
            test-results
            docs/evidence/release
            docs/evidence/article-reading-layout
            docs/evidence/mauri-branding
      - name: Prepare Cloudflare Pages production bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx --yes wrangler@4.157.0 pages functions build functions --outdir dist/_worker.js --compatibility-date 2026-11-04 --minify
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("dist/deploy-info.json", JSON.stringify({commit:process.env.GITHUB_SHA,project:"nceastudy",builtAt:new Date().toISOString()})+"\n");'
      - name: Save upload-ready Cloudflare bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nceastudy-pages-production
          path: dist/
          retention-days: 7
          include-hidden-files: true
      - name: Check Cloudflare production target
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages-target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const latest=execFileSync('git',['ls-remote','origin','refs/heads/main'],{encoding:'utf8'}).trim().split(/\s/)[0];
          if(latest!==process.env.GITHUB_SHA)throw new Error('A newer main commit exists; publish the latest workflow run instead.');
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account)throw new Error('Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository Actions secrets.');
          if(!/^[a-f0-9]{32}$/i.test(account))throw new Error('CLOUDFLARE_ACCOUNT_ID must be a Cloudflare account ID.');
          const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/nceastudy`,{headers:{Authorization:`Bearer ${token}`},signal:AbortSignal.timeout(15000)});
          if(!response.ok)throw new Error(`Cloudflare project lookup failed (HTTP ${response.status}); check token access.`);
          const body=await response.json(),project=body.result;
          if(!body.success||project?.name!=='nceastudy'||project.subdomain!=='nceastudy.pages.dev')throw new Error('Cloudflare returned an unexpected Pages project.');
          const branch=project.production_branch;
          if(typeof branch!=='string'||!branch.length||branch.length>200||!/^[a-zA-Z0-9._/-]+$/.test(branch))throw new Error('Cloudflare production branch is missing or unsupported.');
          appendFileSync(process.env.GITHUB_OUTPUT,`branch=${branch}\n`);
          console.log(`Publishing checked-out main to nceastudy's production branch (${branch}).`);
          JS
      - name: Publish main to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: pages-deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.157.0'
          command: pages deploy dist --project-name=nceastudy --branch="${{ steps.pages-target.outputs.branch }}" --commit-hash=${{ github.sha }}
      - name: Verify published production revision
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          PAGES_ENVIRONMENT: ${{ steps.pages-deploy.outputs.pages-environment }}
        run: |
          node --input-type=module <<'JS'
          import {setTimeout as delay} from 'node:timers/promises';
          if(process.env.PAGES_ENVIRONMENT!=='production')throw new Error('Cloudflare did not create a production deployment.');
          for(let attempt=0;attempt<12;attempt++){
            try{
              const response=await fetch(`https://nceastudy.pages.dev/deploy-info.json?commit=${process.env.GITHUB_SHA}&attempt=${attempt}`,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(10000)});
              if(response.ok&&(await response.json()).commit===process.env.GITHUB_SHA){console.log('Verified merged main is live at https://nceastudy.pages.dev');process.exit(0);}
            }catch{}
            await delay(5000);
          }
          throw new Error('The production URL did not serve this commit; inspect the Cloudflare deployment.');
          JS
