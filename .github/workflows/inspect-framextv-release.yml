name: Inspect approved popularity release alias
on:
  push:
    branches: [diagnose/framextv-popularity-alias]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read existing Pages production deployment metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account||!/^[a-f0-9]{32}$/i.test(account))throw new Error('Existing Cloudflare credentials unavailable.');
          const base=`https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/nceastudy`;
          async function read(path=''){
            const response=await fetch(base+path,{headers:{Authorization:`Bearer ${token}`},signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw new Error(`Pages metadata lookup failed: ${response.status}`);
            const body=await response.json();if(!body.success)throw new Error('Pages metadata lookup unsuccessful.');return body.result;
          }
          function summary(deployment){
            if(!deployment)return null;
            return {id:deployment.id,url:deployment.url,environment:deployment.environment,branch:deployment.deployment_trigger?.metadata?.branch,commit:deployment.deployment_trigger?.metadata?.commit_hash,latestStage:deployment.latest_stage&&{name:deployment.latest_stage.name,status:deployment.latest_stage.status},aliases:deployment.aliases};
          }
          const project=await read();
          if(project?.name!=='nceastudy'||project.subdomain!=='nceastudy.pages.dev'||project.production_branch!=='production')throw new Error('Unexpected existing Pages production target.');
          console.log(JSON.stringify({project:project.name,productionBranch:project.production_branch,canonical:summary(project.canonical_deployment),latest:summary(project.latest_deployment)},null,2));
          const deployments=await read('/deployments?env=production&per_page=5');
          console.log(JSON.stringify({productionDeployments:deployments.map(summary)},null,2));
          JS
