name: Verify QCC QA contracts
on:
  push:
    branches: [diagnostics/qcc-contracts-3fe38b9]
permissions:
  contents: read
concurrency:
  group: qcc-contracts-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    name: QA contracts (${{ matrix.group.name }}, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        group:
          - name: study
            files: tests/e2e/study-editorial.spec.ts tests/e2e/study-expansion.spec.ts tests/e2e/study-fictional-ads.spec.ts tests/e2e/study-reading-layout.spec.ts
          - name: menus
            files: tests/e2e/glass-menus.spec.ts tests/e2e/clear-material-rules.spec.ts tests/e2e/see-through-material.spec.ts tests/e2e/webgl-glass-lens.spec.ts
          - name: games
            files: tests/games/animal-stack/layout.spec.ts tests/games/ball-run/layout.spec.ts tests/games/ball-run/play.spec.ts tests/games/fruit-merge/layout.spec.ts tests/games/fruit-merge/play.spec.ts tests/games/snake/snake.spec.ts tests/games/crossy-road/deaths.spec.ts tests/games/crossy-road/performance.spec.ts tests/games/crossy-road/rendering.spec.ts tests/movies/movies.spec.ts tests/movies/redesign.spec.ts tests/leaderboard/sidebar.spec.ts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3fe38b929d0d79697956076329eae55e8a1de880
      - run: git rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use Ubuntu archive for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify reviewed QA contracts
        run: >-
          xvfb-run -a npm run test:e2e --
          ${{ matrix.group.files }}
          --project=${{ matrix.browser }} --workers=1 --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qcc-contracts-${{ matrix.group.name }}-${{ matrix.browser }}
          path: test-results
          if-no-files-found: warn
