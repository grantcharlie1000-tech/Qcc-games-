name: Verify Social profile scrolling
on:
  pull_request:
    branches: [main]
    paths:
      - src/social/**
      - src/apps/apps.css
      - tests/social/**
      - .github/workflows/social-profile-regression.yml
permissions:
  contents: read
concurrency:
  group: social-profile-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  profile-scroll:
    name: Social profile scrolling (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: xvfb-run -a npx playwright test tests/social/social.spec.ts --project=${{ matrix.browser }} --grep 'profile sticky tabs' --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: social-profile-${{ matrix.browser }}
          path: test-results
