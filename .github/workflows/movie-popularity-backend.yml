# One authorized release, isolated from normal publication. No account metadata is logged.
name: Deploy movie popularity backend
on:
  push:
    branches: [deploy/popular-marlborough-backend]
    paths:
      - .github/workflows/movie-popularity-backend.yml
      - scripts/movie-popularity-provision.mjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: movie-popularity-backend
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'grantcharlie1000-tech/Qcc-games-' && github.ref == 'refs/heads/deploy/popular-marlborough-backend'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XDG_CONFIG_HOME: /tmp/qcc-cloudflare
      WRANGLER_SEND_METRICS: 'false'
      SOURCE_COMMIT: 16880f84a60089f12a94771ef0bbe6f10f9db4a7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify popularity behavior and operator safeguards
        run: |
          npm run check
          npm test -- tests/movies/popularity.test.ts tests/movies/popularity-api.test.ts tests/movies/popularity-d1.test.ts tests/movies/privacy.test.ts tests/movies/provider.test.ts tests/movies/popularity-provision.test.ts --maxWorkers=1
      - name: Prepare synthetic browser tests
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium
          sudo install -d -o "$USER" -g "$(id -gn)" /opt/cursor/artifacts/popular-marlborough
      - name: Verify supported playback and fail-closed players
        run: xvfb-run -a npm run test:e2e -- tests/movies/popularity.spec.ts --project=chromium --workers=1
      - name: Save synthetic verification screenshots
        uses: actions/upload-artifact@v4
        with:
          name: popularity-synthetic-screenshots
          path: /opt/cursor/artifacts/popular-marlborough/*.png
          retention-days: 7
      - name: Retain verified operator script
        run: cp scripts/movie-popularity-provision.mjs /tmp/movie-popularity-provision.mjs
      - name: Validate exact production source and build reviewed app
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SOURCE_COMMIT"
          test "$(git ls-remote origin refs/heads/production | cut -f1)" = "$SOURCE_COMMIT"
          git fetch --no-tags origin "$SOURCE_COMMIT"
          git checkout --detach "$SOURCE_COMMIT"
          node_modules/.bin/esbuild workers/movie-popularity-cleanup.ts --bundle --format=esm --target=es2022 --minify --outfile=/tmp/movie-popularity-cleanup.js
          npm run build
          npx --yes wrangler@4.157.0 pages functions build functions --outdir dist/_worker.js --compatibility-date 2026-11-04 --minify
          node --input-type=module -e 'import {writeFileSync} from "node:fs";writeFileSync("dist/deploy-info.json",JSON.stringify({commit:process.env.SOURCE_COMMIT,project:"nceastudy",sourceBranch:"production",builtAt:new Date().toISOString()})+"\n");'
      - name: Prepare dedicated zero-cost backend and independent cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node /tmp/movie-popularity-provision.mjs prepare
      - name: Publish isolated preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes wrangler@4.157.0 pages deploy dist --project-name=nceastudy --branch=popular-marlborough-qa --commit-hash="$SOURCE_COMMIT" > /tmp/popularity-preview-deploy.log 2>&1; then
            echo 'Preview publication failed. Backend collection remains off in production.'
            exit 1
          fi
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          const urls=readFileSync('/tmp/popularity-preview-deploy.log','utf8').match(/https:\/\/[a-z0-9]+\.nceastudy\.pages\.dev/g)||[];
          if(!urls.length)throw new Error('Could not verify preview publication URL.');
          appendFileSync(process.env.GITHUB_OUTPUT,`url=${urls[0]}\n`);
          console.log('Isolated preview published.');
          JS
      - name: Verify remote D1 ranking and actual idle scheduled cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: node /tmp/movie-popularity-provision.mjs verify-preview "$PREVIEW_URL"
      - name: Enable and publish production with fail-closed rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rollback() {
            trap - ERR
            if node /tmp/movie-popularity-provision.mjs disable-production; then
              if test "$(git ls-remote origin refs/heads/production | cut -f1)" = "$SOURCE_COMMIT" && npx --yes wrangler@4.157.0 pages deploy dist --project-name=nceastudy --branch=production --commit-hash="$SOURCE_COMMIT" > /tmp/popularity-rollback-deploy.log 2>&1; then
                node --input-type=module <<'JS'
          import {setTimeout as delay} from 'node:timers/promises';
          for(let attempt=0;attempt<12;attempt++){
            try{
              const response=await fetch('https://nceastudy.pages.dev/api/movie-popularity',{cache:'no-store',signal:AbortSignal.timeout(10000)});
              if(response.status===503&&(await response.json()).error==='popularity_unavailable'){console.log('Verified collection disabled in published production. Cleanup remains active.');process.exit(0);}
            }catch{}
            await delay(5000);
          }
          throw new Error('Published fail-closed rollback needs operator verification.');
          JS
              else
                echo 'Disabled future collection configuration, but rollback publication needs operator verification.'
              fi
            else
              echo 'Collection rollback requires operator action.'
            fi
            return 1
          }
          trap rollback ERR
          node /tmp/movie-popularity-provision.mjs enable-production
          test "$(git ls-remote origin refs/heads/production | cut -f1)" = "$SOURCE_COMMIT"
          if ! npx --yes wrangler@4.157.0 pages deploy dist --project-name=nceastudy --branch=production --commit-hash="$SOURCE_COMMIT" > /tmp/popularity-production-deploy.log 2>&1; then
            echo 'Production publication failed; disabling new collection.'
            false
          fi
          node --input-type=module <<'JS'
          import {setTimeout as delay} from 'node:timers/promises';
          let verified=false;
          for(let attempt=0;attempt<12;attempt++){
            try{
              const info=await fetch(`https://nceastudy.pages.dev/deploy-info.json?commit=${process.env.SOURCE_COMMIT}&attempt=${attempt}`,{cache:'no-store',signal:AbortSignal.timeout(10000)});
              const api=await fetch('https://nceastudy.pages.dev/api/movie-popularity',{cache:'no-store',signal:AbortSignal.timeout(10000)});
              const body=api.ok?await api.json():undefined;
              if(info.ok&&(await info.json()).commit===process.env.SOURCE_COMMIT&&api.status===200&&api.headers.get('cache-control')==='no-store'&&!api.headers.has('access-control-allow-origin')&&Array.isArray(body?.titleIds)&&body.titleIds.length===0&&body.windowDays===7){verified=true;break;}
            }catch{}
            await delay(5000);
          }
          if(!verified)throw new Error('Production revision and empty aggregate endpoint were not verified.');
          console.log('Verified production revision and empty, no-store aggregate endpoint.');
          JS
          trap - ERR
      - name: Record verified public result
        run: echo 'Verified Popular in Marlborough backend at https://nceastudy.pages.dev from source 16880f84a60089f12a94771ef0bbe6f10f9db4a7. Synthetic title fixtures were removed; test rate buckets remain subject to normal hourly expiry and scheduled cleanup. Unsupported streams remain fail closed.' >> "$GITHUB_STEP_SUMMARY"
