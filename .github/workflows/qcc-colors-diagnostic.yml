name: Verify QCC accessibility regressions
on:
  push:
    branches: [diagnostics/qcc-colors-405c490]
permissions:
  contents: read
concurrency:
  group: qcc-colors-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focus:
    name: Accessibility regressions (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 44b6d3b530b42b813f89ff59a0635d8726e5071d
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Use Ubuntu archive for browser dependencies
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify exact proposed PR accessibility fix
        run: >-
          xvfb-run -a npm run test:e2e --
          tests/movies/auto-next.spec.ts
          tests/games/flappy-bird/play.spec.ts
          tests/e2e/qa-priority.spec.ts
          tests/e2e/glass-menus.spec.ts
          tests/accounts/accounts.spec.ts
          --project=${{ matrix.browser }} --workers=1 --reporter=list
          --grep 'logout in another tab|forced colours|keyboard focus in the island|keyboard focus in the separate Menu|explicit player focus after cancelling Up next|keyboard and mouse flap, pause and Study freeze|closing a dialog does not steal a newly focused game canvas'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qcc-colors-${{ matrix.browser }}
          path: test-results
          if-no-files-found: warn
