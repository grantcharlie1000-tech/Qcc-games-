name: Point production at the verified popularity bundle
on:
  push:
    branches: [deploy/framextv-popularity-promote-once]
permissions:
  contents: read
concurrency:
  group: arcade-pages-production
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify current source and promote the existing approved bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {setTimeout as delay} from 'node:timers/promises';
          const expected='cc6a7e6ce108d6ea196f8b71b7a1f04c72186eae',target='c73f1da4-2cda-48f4-806f-78d31d39dc0b',prior='307481e5-98cf-40d0-ae2a-dd516042e362';
          const latest=execFileSync('git',['ls-remote','https://github.com/grantcharlie1000-tech/Qcc-games-.git','refs/heads/production'],{encoding:'utf8'}).trim().split(/\s/)[0];
          if(latest!==expected)throw new Error('Production source changed; stop promotion.');
          const token=process.env.CLOUDFLARE_API_TOKEN,account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account||!/^[a-f0-9]{32}$/i.test(account))throw new Error('Existing Cloudflare credentials unavailable.');
          const base=`https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/nceastudy`;
          async function api(path='',method='GET'){
            const response=await fetch(base+path,{method,headers:{Authorization:`Bearer ${token}`},signal:AbortSignal.timeout(15000)});
            if(!response.ok)throw new Error(`Pages request failed: ${response.status}`);
            const body=await response.json();if(!body.success)throw new Error('Pages request unsuccessful.');return body.result;
          }
          function approved(deployment){return deployment?.environment==='production'&&deployment.deployment_trigger?.metadata?.branch==='production'&&deployment.deployment_trigger?.metadata?.commit_hash===expected&&deployment.latest_stage?.name==='deploy'&&deployment.latest_stage?.status==='success';}
          const project=await api();
          if(project?.name!=='nceastudy'||project.subdomain!=='nceastudy.pages.dev'||project.production_branch!=='production')throw new Error('Unexpected existing production target.');
          if(!approved(project.canonical_deployment)||![prior,target].includes(project.canonical_deployment.id))throw new Error('Canonical deployment changed; stop promotion.');
          const deployment=await api('/deployments/'+target);
          if(!approved(deployment)||deployment.id!==target||deployment.url!=='https://c73f1da4.nceastudy.pages.dev')throw new Error('Unapproved promotion target.');
          const direct=await fetch(deployment.url+'/deploy-info.json',{cache:'no-store',signal:AbortSignal.timeout(10000)});
          if(!direct.ok||(await direct.json()).commit!==expected)throw new Error('Target bundle is not the approved release.');
          if(project.canonical_deployment.id!==target){
            const current=await api();
            const source=execFileSync('git',['ls-remote','https://github.com/grantcharlie1000-tech/Qcc-games-.git','refs/heads/production'],{encoding:'utf8'}).trim().split(/\s/)[0];
            if(source!==expected||current.canonical_deployment?.id!==project.canonical_deployment.id||!approved(current.canonical_deployment))throw new Error('Release state changed immediately before promotion.');
            await api('/deployments/'+target+'/rollback','POST');
            console.log('Pointed production at the existing verified bundle. No new upload, build, migration, binding or credential change.');
          }else console.log('The verified bundle is already canonical; no write made.');
          const origin='https://nceastudy.pages.dev';
          for(let attempt=0;attempt<24;attempt++){
            try{
              const current=await api();
              if(current.canonical_deployment?.id!==target||!approved(current.canonical_deployment))throw new Error('Canonical deployment mismatch.');
              const response=await fetch(`${origin}/deploy-info.json?release=${expected}&attempt=${attempt}`,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(10000)});
              if(!response.ok||(await response.json()).commit!==expected)throw new Error('Live revision mismatch.');
              for(const path of ['/',`/?release=${expected}&attempt=${attempt}`]){
                const root=await fetch(origin+path,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(10000)});
                if(!root.ok||!(await root.text()).includes('src="./assets/index-BDWD42F-.js"'))throw new Error('Production root does not load the approved app bundle.');
              }
              const asset=await fetch(origin+'/assets/index-BDWD42F-.js',{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(10000)});
              const hash=createHash('sha256').update(Buffer.from(await asset.arrayBuffer())).digest('hex');
              if(!asset.ok||hash!=='8faf5bd922867a33a4356523c6f580bf906b59992d9c46c316d16e87deb161b9')throw new Error('Live app bundle mismatch.');
              const popularity=await fetch(origin+'/api/movie-popularity',{cache:'no-store',signal:AbortSignal.timeout(10000)});
              if(popularity.status!==200||popularity.headers.get('cache-control')!=='no-store'||popularity.headers.has('access-control-allow-origin')||!Array.isArray((await popularity.json()).titleIds))throw new Error('Live popularity endpoint unavailable.');
              const account=await fetch(origin+'/.netlify/functions/accounts?action=movies',{cache:'no-store',signal:AbortSignal.timeout(15000)});
              if(account.status!==401||account.headers.get('cache-control')!=='no-store')throw new Error('Account authentication boundary unavailable.');
              console.log(`Verified canonical bundle, public revision, app SHA256, popularity API and account authentication boundary for ${expected}.`);
              process.exit(0);
            }catch{}
            await delay(5000);
          }
          throw new Error('The main address did not verify the approved bundle and APIs.');
          JS
